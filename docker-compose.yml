# ============================================
# KITERP - Docker Compose (Development)
# ============================================
# Usage:
#   docker compose up              # Start all services
#   docker compose up -d           # Start in detached mode
#   docker compose up backend      # Start only backend + deps
#   docker compose down            # Stop all services
#   docker compose down -v         # Stop + remove volumes (reset data)
#   docker compose logs -f backend # Follow backend logs
#   docker compose build           # Rebuild all images
# ============================================

services:

  # ---- Infrastructure ----

  postgres:
    image: postgres:15-alpine
    container_name: kiterp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kiterp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # Override with POSTGRES_HOST_PORT in project root .env if host 5432 is already taken (e.g. local Postgres).
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kiterp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: kiterp-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Backend API ----

  backend:
    build:
      context: ./backend
      target: development
    container_name: kiterp-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=KIT ERP API
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/kiterp
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=365
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-kiterp-uploads}
      - SKIP_MIGRATIONS=${SKIP_MIGRATIONS:-false}
      # CRM
      - CRM_ENCRYPTION_KEY=${CRM_ENCRYPTION_KEY:-}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Docker Desktop (Windows/Mac): bind-mount file events don't reach inotify inside the container.
      # Force polling so uvicorn --reload picks up Python edits without restarting the container.
      - WATCHFILES_FORCE_POLLING=true
      - WATCHFILES_POLL_DELAY_MS=1000
      - BUILD_RUNNER_API_KEY=${BUILD_RUNNER_API_KEY:-kiterp-local-build-runner}
    volumes:
      - ./backend:/app
      # So branded-app builds can write mobile/vendors/<slug>/ on the host
      - ./mobile:/app/mobile
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      start_period: 120s

  # ---- CRM background workers (Celery) ----

  crm-worker:
    build:
      context: ./backend
      target: development
    container_name: kiterp-crm-worker
    restart: unless-stopped
    command:
      - watchfiles
      - --filter
      - python
      - celery -A app.worker.celery_app worker --loglevel=info -Q crm,default
      - /app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/kiterp
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - CRM_ENCRYPTION_KEY=${CRM_ENCRYPTION_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WATCHFILES_FORCE_POLLING=true
      - WATCHFILES_POLL_DELAY_MS=1000
    volumes:
      - ./backend:/app
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  crm-beat:
    build:
      context: ./backend
      target: development
    container_name: kiterp-crm-beat
    restart: unless-stopped
    command:
      - watchfiles
      - --filter
      - python
      - celery -A app.worker.celery_app beat --loglevel=info
      - /app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/kiterp
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - CRM_ENCRYPTION_KEY=${CRM_ENCRYPTION_KEY:-}
      - WATCHFILES_FORCE_POLLING=true
      - WATCHFILES_POLL_DELAY_MS=1000
    volumes:
      - ./backend:/app
    healthcheck:
      disable: true
    depends_on:
      - redis

  # ---- Frontend Apps ----

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: kiterp-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Vite dev proxy runs inside this container — use Compose DNS, not 127.0.0.1
      - BACKEND_PROXY_TARGET=http://backend:8000
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_BASE_DOMAIN=kiterp.com
      # Bind-mount file events are unreliable on Docker Desktop (Windows); poll so Vite picks up edits.
      - VITE_WATCH_POLLING=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  vendor-web:
    build:
      context: ./vendor-web
      target: development
    container_name: kiterp-vendor
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - BACKEND_URL=http://backend:8000
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_STOREFRONT_URL=http://localhost:3002
      # Bind-mount file events are unreliable on Docker Desktop (Windows); poll so Vite picks up storefront-web changes.
      - VITE_WATCH_POLLING=1
    volumes:
      - ./vendor-web:/app
      - ./storefront-web:/storefront-web:ro
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  storefront-web:
    build:
      context: ./storefront-web
      target: development
    container_name: kiterp-storefront
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - BACKEND_URL=http://backend:8000
      - VITE_API_URL=http://localhost:8000/api/v1
      # Bind-mount file events are unreliable on Docker Desktop (Windows); poll so Vite picks up storefront-web changes.
      - VITE_WATCH_POLLING=1
    volumes:
      - ./storefront-web:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    name: kiterp-postgres-data
  redis_data:
    name: kiterp-redis-data
  backend_uploads:
    name: kiterp-uploads

networks:
  default:
    name: kiterp-network
