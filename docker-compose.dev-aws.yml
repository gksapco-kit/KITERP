# ============================================
# KITERP - Docker Compose (AWS Free Tier / Dev)
# ============================================
# Optimized for EC2 t3.micro (1 vCPU, 1 GB RAM).
# All databases run in Docker. Frontends are built
# at image build time and served as static files
# by Nginx -- no separate frontend containers at runtime.
#
# Prerequisites:
#   - 2 GB swap enabled (see scripts/setup-ec2-free.sh)
#   - Copy .env.dev.example to .env
#
# Usage:
#   docker compose -f docker-compose.dev-aws.yml up -d --build
#   docker compose -f docker-compose.dev-aws.yml down
#   docker compose -f docker-compose.dev-aws.yml logs -f backend
# ============================================

services:

  # ---- Infrastructure (lightweight, in-container) ----

  postgres:
    image: postgres:15-alpine
    container_name: kiterp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kiterp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    # Memory-constrained: limit postgres to ~200 MB
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kiterp"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: kiterp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru --save ""
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ---- Backend API ----

  backend:
    build:
      context: ./backend
      target: production
    container_name: kiterp-backend
    restart: unless-stopped
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      - APP_NAME=KIT ERP API
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/kiterp
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-not-for-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-kiterp-uploads-dev}
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - SKIP_MIGRATIONS=${SKIP_MIGRATIONS:-false}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ---- Frontend Apps (built as static, served by Nginx) ----
  # On t3.micro we cannot run 3 separate Node containers at runtime.
  # Instead, each frontend is built at image-build time and the
  # dist/ output is copied into Nginx via a shared volume.

  frontend-build:
    build:
      context: ./frontend
      target: build
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
    container_name: kiterp-admin-build
    volumes:
      - admin_dist:/app/dist
    entrypoint: ["sh", "-c", "cp -r /app/dist/* /app/dist/ 2>/dev/null; echo 'Admin build ready'; sleep 2"]
    networks:
      - internal

  vendor-build:
    build:
      context: .
      dockerfile: vendor-web/Dockerfile.aws
      target: build
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: kiterp-vendor-build
    volumes:
      - vendor_dist:/app/dist
    entrypoint: ["sh", "-c", "cp -r /app/dist/* /app/dist/ 2>/dev/null; echo 'Vendor build ready'; sleep 2"]
    networks:
      - internal

  storefront-build:
    build:
      context: ./storefront-web
      target: build
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: kiterp-storefront-build
    volumes:
      - storefront_dist:/app/dist
    entrypoint: ["sh", "-c", "cp -r /app/dist/* /app/dist/ 2>/dev/null; echo 'Storefront build ready'; sleep 2"]
    networks:
      - internal

  # ---- Nginx (serves everything) ----

  nginx:
    image: nginx:alpine
    container_name: kiterp-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 64M
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - admin_dist:/usr/share/nginx/html/admin:ro
      - vendor_dist:/usr/share/nginx/html/vendor:ro
      - storefront_dist:/usr/share/nginx/html/storefront:ro
    depends_on:
      - backend
      - frontend-build
      - vendor-build
      - storefront-build
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: kiterp-dev-pg
  redis_data:
    name: kiterp-dev-redis
  backend_uploads:
    name: kiterp-dev-uploads
  admin_dist:
    name: kiterp-dev-admin-dist
  vendor_dist:
    name: kiterp-dev-vendor-dist
  storefront_dist:
    name: kiterp-dev-storefront-dist

networks:
  internal:
    name: kiterp-dev-network
