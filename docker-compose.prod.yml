# ============================================
# KITERP - Docker Compose (Production / AWS)
# ============================================
# Designed for AWS deployment with managed databases:
#   - RDS PostgreSQL
#   - ElastiCache Redis
#
# Usage:
#   docker compose --env-file .env.config -f docker-compose.prod.yml up -d --build
#   docker compose --env-file .env.config -f docker-compose.prod.yml down
#   docker compose --env-file .env.config -f docker-compose.prod.yml logs -f
#
# Prerequisites:
#   - Copy/update .env.config and fill in all values
#   - Ensure managed DB endpoints are reachable from this host
#   - Open EC2 security group inbound port 80
#   - Later, when a real domain is available, add HTTPS/443 server blocks
# ============================================

services:

  # ---- Backend API ----

  backend:
    build:
      context: ./backend
      target: production
    container_name: kiterp-backend
    restart: always
    # Load all keys from .env.config into the container (email, Twilio, Razorpay, etc.).
    # docker compose --env-file .env.config still required for ${VAR} substitution below.
    env_file:
      - .env.config
    expose:
      - "8000"
    environment:
      - APP_NAME=KIT ERP API
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env.config}
      - REDIS_URL=${REDIS_URL:?Set REDIS_URL in .env.config}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.config}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-365}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-kiterp-uploads}
      - AWS_CLOUDFRONT_URL=${AWS_CLOUDFRONT_URL:-}
      - BASE_DOMAIN=${BASE_DOMAIN:-kiterp.com}
      - CRM_ENCRYPTION_KEY=${CRM_ENCRYPTION_KEY:-}
      # Email/Twilio secrets (SENDGRID_API_KEY, SMTP_*, TWILIO_*) come from
      # env_file (.env.config) only. Listing SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      # here used to wipe the key when compose interpolation was empty.
      - SMTP_PORT=${SMTP_PORT:-587}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@kiterp.com}
      - SENDGRID_OTP_TEMPLATE_ID=${SENDGRID_OTP_TEMPLATE_ID:-d-14f75148da1a4b7d8a1a5f8cf9f388a5}
      - AUTO_APPROVE_NEW_VENDORS=${AUTO_APPROVE_NEW_VENDORS:-true}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - SKIP_MIGRATIONS=${SKIP_MIGRATIONS:-false}
      # Branded-app build runner (scripts/build-runner.py on EC2 or CI host)
      - BUILD_RUNNER_API_KEY=${BUILD_RUNNER_API_KEY:-}
    volumes:
      # Code is baked into the image; mount mobile so admin "save config / trigger build"
      # can write vendors/<slug>/ on the EC2 host for the build runner.
      - ./mobile:/app/mobile
      - backend_uploads:/app/uploads
    networks:
      - internal

  # ---- Frontend Apps (Production - Nginx static) ----

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: ${VITE_ADMIN_API_URL:-/api/v1}
        VITE_BASE_DOMAIN: ${BASE_DOMAIN:-kiterp.com}
        VITE_PUBLIC_BASE_PATH: ${VITE_ADMIN_BASE_PATH:-/admin/}
        VITE_ROUTER_BASENAME: ${VITE_ADMIN_ROUTER_BASENAME:-/admin}
        VITE_VENDOR_URL: ${VITE_VENDOR_URL:?Set VITE_VENDOR_URL in .env.config}
        # Required for admin template Preview — without this, URLs become
        # https://{slug}.kiterp.com/... which has no DNS (NXDOMAIN) on path-based prod.
        VITE_STOREFRONT_URL: ${VITE_STOREFRONT_URL:?Set VITE_STOREFRONT_URL in .env.config}
    container_name: kiterp-admin
    restart: always
    expose:
      - "3000"
    networks:
      - internal

  vendor-web:
    build:
      context: .
      dockerfile: vendor-web/Dockerfile.aws
      target: production
      args:
        VITE_API_URL: ${VITE_VENDOR_API_URL:-/api/v1}
        VITE_PUBLIC_BASE_PATH: ${VITE_VENDOR_BASE_PATH:-/vendor/}
        VITE_ROUTER_BASENAME: ${VITE_VENDOR_ROUTER_BASENAME:-/vendor}
        VITE_STOREFRONT_URL: ${VITE_STOREFRONT_URL:?Set VITE_STOREFRONT_URL in .env.config}
    container_name: kiterp-vendor
    restart: always
    expose:
      - "3001"
    networks:
      - internal

  storefront-web:
    build:
      context: ./storefront-web
      target: production
      args:
        VITE_API_URL: ${VITE_STOREFRONT_API_URL:-/api/v1}
        VITE_PUBLIC_BASE_PATH: ${VITE_STOREFRONT_BASE_PATH:-/}
        VITE_BASE_DOMAIN: ${BASE_DOMAIN:-kiterp.com}
        VITE_VENDOR_URL: ${VITE_VENDOR_URL:?Set VITE_VENDOR_URL in .env.config}
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:?Set VITE_ADMIN_URL in .env.config}
    container_name: kiterp-storefront
    restart: always
    expose:
      - "3002"
    networks:
      - internal

  # ---- Nginx Reverse Proxy / Gateway ----

  nginx:
    image: nginx:alpine
    container_name: kiterp-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_webroot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
      - vendor-web
      - storefront-web
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend_uploads:
    name: kiterp-uploads
  certbot_webroot:
    name: kiterp-certbot

networks:
  internal:
    name: kiterp-internal
