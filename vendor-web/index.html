<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('vendor-ui-theme')
          if (!raw) return
          var o = JSON.parse(raw)
          var state = o && o.state
          if (!state) return
          var root = document.documentElement
          if (state.dark) root.classList.add('dark')
          if (state.colorTheme) root.dataset.kitTheme = state.colorTheme
          if (state.layoutTemplate) root.dataset.kitTemplate = state.layoutTemplate
        } catch (e) {}
      })()
    </script>
