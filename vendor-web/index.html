<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('vendor-ui-theme')
          if (!raw) return
          var o = JSON.parse(raw)
          var state = o && o.state
          if (!state) return
          var root = document.documentElement
          if (state.dark) root.classList.add('dark')
          if (state.colorTheme) root.dataset.kitTheme = state.colorTheme
          if (state.layoutTemplate) root.dataset.kitTemplate = state.layoutTemplate
        } catch (e) {}
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=8" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=8" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png?v=8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Fonts used by website builder canvas (matches business front template previews) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>KITERP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
