# ============================================
# AsureIT - Nginx Dev Config (HTTP only)
# ============================================
# Used with docker-compose.dev-aws.yml on AWS Free Tier.
# No SSL -- accessed via http://<EC2-PUBLIC-IP>.
#
# All three frontends are served as static files from
# Nginx (built at image-build time), and the API is
# reverse-proxied to the backend container.
# ============================================

# ---- Health check ----
server {
    listen 80 default_server;
    server_name _;

    location /health {
        access_log off;
        return 200 '{"status":"ok","env":"dev"}';
        add_header Content-Type application/json;
    }

    # ---- API (reverse proxy to FastAPI) ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- Swagger / ReDoc ----
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ---- Uploaded files ----
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # ---- Admin Panel: http://<IP>/admin/ ----
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- Vendor Dashboard: http://<IP>/vendor/ ----
     location = /vendor/signup {
        return 301 /create-business;
    }
    location = /vendor/verify-email {
        return 301 /create-business/verify-email;
    }
  
 
    location /vendor/ {
        alias /usr/share/nginx/html/vendor/;
        try_files $uri $uri/ /vendor/index.html;
    }

    # ---- Customer Storefront: http://<IP>/ (default) ----
    location / {
        root /usr/share/nginx/html/storefront;
        try_files $uri $uri/ /index.html;
    }
}
