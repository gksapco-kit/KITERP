# ============================================
# KITERP - Production gateway (HTTP + HTTPS)
# ============================================
# Requires Let's Encrypt certs on the EC2 host:
#   /etc/letsencrypt/live/kiterp.com/fullchain.pem
#   /etc/letsencrypt/live/kiterp.com/privkey.pem
#
# Custom domains (e.g. www.vedikaraksha.com):
#   1. Vendor sets DNS (www CNAME → {slug}.kiterp.com, TXT verify, apex → www)
#   2. Admin marks external domain access_status = active (syncs Vendor.custom_domain)
#   3. Issue TLS once per domain (HTTP-01 via the ACME location below):
#        certbot certonly --webroot -w /var/www/certbot \
#          -d vedikaraksha.com -d www.vedikaraksha.com
#   4. Reload nginx after the cert exists. Optional: point ssl_certificate
#      below at a multi-SAN or use Cloudflare/Caddy on-demand TLS at scale.
#
# Platform routing is Host-based in the storefront SPA — no per-domain
# nginx server_name edits are required for storefront URL mapping.
# ============================================

# HTTP — health check, ACME, redirect everything else to HTTPS
server {
    listen 80 default_server;
    server_name _;

    location /health {
        access_log off;
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — platform apex
server {
    listen 443 ssl;
    server_name kiterp.com www.kiterp.com;

    ssl_certificate /etc/letsencrypt/live/kiterp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiterp.com/privkey.pem;

    location /health {
        access_log off;
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://admin_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /vendor {
        return 301 /vendor/;
    }

    location = /vendor/signup {
        return 301 /create-business;
    }

    location = /vendor/verify-email {
        return 301 /create-business/verify-email;
    }

    location /vendor/ {
        proxy_pass http://vendor_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://storefront_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS — vendor subdomains (*.kiterp.com) + custom domains (SNI catch-all).
# Uses the platform cert as a fallback so routing works immediately; issue a
# dedicated Let's Encrypt cert per custom domain (see header comments) to clear
# browser "Not secure" warnings for that Host.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/kiterp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiterp.com/privkey.pem;

    location /health {
        access_log off;
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://storefront_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
