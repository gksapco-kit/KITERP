server {
    listen 80;
    server_name kiterp.com www.kiterp.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kiterp.com www.kiterp.com;

    ssl_certificate /etc/letsencrypt/live/kiterp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiterp.com/privkey.pem;

    location /health {
        access_log off;
<<<<<<< Updated upstream
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Certbot ACME challenge (for HTTP-01 validation)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    location = /admin {
        return 301 /admin/;
=======
        return 200 'ok';
        add_header Content-Type text/plain;
>>>>>>> Stashed changes
    }

    # ADMIN
    location /admin/ {
        proxy_pass http://kiterp-admin:3000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # VENDOR
    location = /vendor/signup {
        return 301 /create-business;
    }

    location = /vendor/verify-email {
        return 301 /create-business/verify-email;
    }

    location /vendor/ {
        proxy_pass http://kiterp-vendor:3001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://kiterp-backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOREFRONT
    location / {
        proxy_pass http://kiterp-storefront:3002/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
